syntax = "proto3";
package laredo.replication.v1;

option go_package = "github.com/zourzouvillys/laredo/gen/laredo/replication/v1;replicationv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service LaredoReplicationService {
  // Primary replication stream. The client opens with a SyncStart declaring
  // its state, receives catch-up data (snapshot or delta), then live changes.
  //
  // The stream is bidirectional so the client can acknowledge what it has
  // actually applied. Server-side status could only ever report what had been
  // *sent* — and "sent" is not "applied": the receiving client still has to
  // decode the row, install it, and survive doing so. An operator asking
  // whether a configuration change has reached the fleet needs the second
  // answer, not the first, and reporting the first as though it were the
  // second is worse than reporting nothing.
  rpc Sync(stream SyncClientMessage) returns (stream SyncResponse);

  // List available snapshots that clients can use for bootstrapping.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Fetch a specific snapshot. Streaming response for large snapshots.
  rpc FetchSnapshot(FetchSnapshotRequest) returns (stream FetchSnapshotResponse);

  // Get current server state (latest sequence, journal bounds, client count).
  rpc GetReplicationStatus(GetReplicationStatusRequest) returns (GetReplicationStatusResponse);
}

// ============================================================
// Sync (primary replication stream)
// ============================================================

// SyncClientMessage is anything the client sends on the Sync stream. The first
// message must be a SyncStart; subsequent ones are acknowledgements.
message SyncClientMessage {
  oneof message {
    SyncStart start = 1;
    ApplyAck ack = 2;
  }
}

// ApplyAck reports what the client has durably applied to its own replica.
//
// applied_source_position is the coordinate that matters: it is stable across
// server instances, so it survives failover, and it advances only once the
// client has installed the change. A client that is connected and receiving
// but failing to apply — a decode error, or a consumer that cannot accept the
// value — reports its error here rather than appearing healthy.
message ApplyAck {
  int64 applied_sequence = 1;
  string applied_source_position = 2;

  // Opaque, client-chosen identifier for the state it has installed (for
  // example a content hash). Lets a caller confirm that two subscribers hold
  // the same thing, not merely that both reached the same position.
  string applied_generation = 3;

  // Non-empty when the client failed to apply what it received. The server
  // records it and surfaces it on GetReplicationStatus; it does not terminate
  // the stream, because the client may recover on the next change.
  string apply_error = 4;
}

message SyncStart {
  string schema = 1;
  string table = 2;
  int64 last_known_sequence = 3;
  string last_snapshot_id = 4;
  string client_id = 5;
  // Last source position (e.g. PostgreSQL WAL LSN) the client has applied.
  // Unlike last_known_sequence (which is per-server), this is stable across
  // server instances, enabling resume after failover to a different instance
  // without a full re-sync.
  string last_known_source_position = 6;

  // Optional server-side subscription filter. When non-empty, the client
  // receives only rows and change events whose column values satisfy ALL of
  // these predicates (logical AND), applied uniformly across the snapshot,
  // journal catch-up, and live phases.
  //
  // The common use is partition scoping: a single equality predicate on a
  // partition column (e.g. tenant_id) gives each subscriber its own slice of a
  // shared table without a separate pipeline, and without other partitions'
  // rows ever crossing the wire. Filter columns are assumed stable for a row's
  // lifetime (see the fan-out guide for the rationale and resume semantics).
  // Empty means no filtering — the subscriber receives the whole table.
  repeated FieldPredicate filters = 7;
}

// FieldPredicate is one column-level condition in a subscription filter
// (SyncStart.filters). It is evaluated against a row's column values: the
// post-change row for INSERT and UPDATE, and the pre-change row for DELETE.
// TRUNCATE and schema-change markers always pass — they are structural and
// apply to the whole replica. A missing or null column never matches.
message FieldPredicate {
  // Column name to test.
  string field = 1;

  oneof match {
    // Equality. Numbers compare numerically (a predicate value of 42 matches a
    // column stored as an integer or a float 42); strings and booleans compare
    // by value. This is the common partition-key case.
    google.protobuf.Value equals = 2;

    // String prefix. Matches only string-typed column values.
    string prefix = 3;

    // Membership: the column value equals one of these (same comparison rules
    // as `equals`).
    google.protobuf.ListValue in = 4;
  }
}

message SyncResponse {
  oneof message {
    SyncHandshake handshake = 1;
    SnapshotBegin snapshot_begin = 2;
    SnapshotRow snapshot_row = 3;
    SnapshotEnd snapshot_end = 4;
    ReplicationJournalEntry journal_entry = 5;
    SchemaChangeNotification schema_change = 6;
    Heartbeat heartbeat = 7;
    GoAway go_away = 8;
  }
}

// GoAway tells the client to hand off to another server instance. The client
// should reconnect (re-dialing its configured address, which an LB routes to a
// healthy instance) and resume from its last applied source position, then
// cleanly close this stream. Sent when the server is draining (graceful
// shutdown or operator command).
message GoAway {
  string reason = 1; // "draining" | "admin"
  // Optional hard cutoff: the server will stop serving this stream after this
  // time even if the client has not finished handing off. Zero means no
  // explicit deadline.
  int64 drain_deadline_unix_ms = 2;
}

message SyncHandshake {
  SyncMode mode = 1;
  int64 server_current_sequence = 2;
  int64 journal_oldest_sequence = 3;
  int64 resume_from_sequence = 4;
  repeated ColumnDefinition columns = 5;
  string snapshot_id = 6;
}

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_FULL_SNAPSHOT = 1;
  SYNC_MODE_DELTA = 2;
  SYNC_MODE_DELTA_FROM_SNAPSHOT = 3;
  // Cold-tier replay: the client is too far behind the in-memory journal, but
  // the server is configured with a cold archive (written by laredo-snapshotter)
  // that can bridge the gap. The server reconstructs catch-up from the archive
  // (a base snapshot and/or diffs) and hands off to the hot journal and live
  // stream, instead of a full live re-snapshot. The message stream is the same
  // as the other modes — snapshot rows and/or journal entries — so a client
  // needs no special handling; the mode is informational (cold catch-up reads
  // object storage and may be slower). See EDR-0002.
  SYNC_MODE_REPLAY_ARCHIVE = 4;
}

message SnapshotBegin {
  string snapshot_id = 1;
  int64 sequence = 2;
  int64 row_count = 3;
}

message SnapshotRow {
  google.protobuf.Struct row = 1;
}

message SnapshotEnd {
  int64 sequence = 1;
  int64 rows_sent = 2;
}

message ReplicationJournalEntry {
  int64 sequence = 1;
  string source_position = 2;
  google.protobuf.Timestamp timestamp = 3;
  string action = 4;
  google.protobuf.Struct old_values = 5;
  google.protobuf.Struct new_values = 6;
}

message SchemaChangeNotification {
  int64 sequence = 1;
  repeated ColumnDefinition old_columns = 2;
  repeated ColumnDefinition new_columns = 3;
}

message ColumnDefinition {
  int32 ordinal_position = 1;
  string column_name = 2;
  string data_type = 3;
  bool not_null = 4;
  bool is_primary_key = 5;
  int32 primary_key_ordinal = 6;
}

message Heartbeat {
  int64 current_sequence = 1;
  google.protobuf.Timestamp server_time = 2;

  // The source position (e.g. PostgreSQL WAL LSN) the server has reached.
  //
  // Without this a subscriber's position only advanced when a journal entry
  // it was subscribed to arrived, so a filtered or simply idle subscriber
  // fell arbitrarily far behind the true tail while appearing healthy. On
  // failover it then resumed from that stale position and forced needless
  // catch-up, or a full re-snapshot once the position aged out of the
  // journal. Heartbeats carry it so an idle subscriber stays current.
  string source_position = 3;
}

// ============================================================
// Snapshot browsing
// ============================================================

message ListSnapshotsRequest {
  string schema = 1;
  string table = 2;
  int32 limit = 3;
}

message ListSnapshotsResponse {
  repeated ReplicationSnapshotInfo snapshots = 1;
}

message ReplicationSnapshotInfo {
  string snapshot_id = 1;
  int64 sequence = 2;
  string source_position = 3;
  int64 row_count = 4;
  int64 size_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
}

message FetchSnapshotRequest {
  string snapshot_id = 1;
}

message FetchSnapshotResponse {
  oneof chunk {
    SnapshotBegin begin = 1;
    SnapshotRow row = 2;
    SnapshotEnd end = 3;
  }
}

// ============================================================
// Status
// ============================================================

message GetReplicationStatusRequest {
  string schema = 1;
  string table = 2;
}

message GetReplicationStatusResponse {
  int64 current_sequence = 1;
  int64 journal_oldest_sequence = 2;
  int64 journal_entry_count = 3;
  int64 row_count = 4;
  int32 connected_clients = 5;
  repeated ConnectedClient clients = 6;
  ReplicationSnapshotInfo latest_snapshot = 7;
}

message ConnectedClient {
  string client_id = 1;

  // What the server has SENT to this client.
  int64 current_sequence = 2;
  int64 behind_count = 3;
  int32 buffer_depth = 4;
  google.protobuf.Timestamp connected_at = 5;
  string state = 6;

  // What the client reports it has APPLIED, from ApplyAck. Distinct from
  // current_sequence on purpose: a client can be sent everything and have
  // applied none of it. Empty/zero from a client that has never acked.
  int64 applied_sequence = 7;
  string applied_source_position = 8;
  string applied_generation = 9;
  string apply_error = 10;
  google.protobuf.Timestamp last_ack_at = 11;
}
